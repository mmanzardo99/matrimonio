  <style>
    :root {
      --primary: #4B6B82;
      --primary-dark: #324e63;
      --accent: #b89d6e;
      --text-dark: #2c3e50;
      --text-muted: #64748b;
      --bg-cream: #fafaf7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Montserrat", sans-serif;
      color: var(--text-dark);
      background-color: var(--bg-cream);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow-x: hidden;
      padding: 1.5rem;
    }

    .floral-corner {
      position: fixed;
      width: 320px;
      height: 320px;
      pointer-events: none;
      z-index: 1;
      opacity: 0.9;
      background-image: url("floral_corner.svg");
      background-repeat: no-repeat;
      background-size: contain;
    }

    .floral-top-left {
      top: -15px;
      left: -15px;
    }

    .floral-bottom-right {
      bottom: -15px;
      right: -15px;
      transform: rotate(180deg);
    }

    .login-card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 3.5rem 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 16px 45px rgba(75, 107, 130, 0.12);
      border: 1px solid rgba(219, 229, 238, 0.8);
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .cross-symbol {
      margin-bottom: 1.2rem;
    }

    .badge {
      font-size: 0.85rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 3rem;
      color: var(--text-dark);
      margin-bottom: 0.4rem;
      line-height: 1.1;
    }

    h1 span {
      color: var(--primary);
      font-style: italic;
    }

    .date {
      font-size: 1.05rem;
      letter-spacing: 2px;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .instruction {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 1.8rem;
      line-height: 1.6;
    }

    .input-group {
      position: relative;
      margin-bottom: 1.5rem;
    }

    .password-input {
      width: 100%;
      padding: 1rem 1.4rem;
      border: 1.5px solid #d4e0eb;
      border-radius: 30px;
      font-size: 1rem;
      font-family: "Montserrat", sans-serif;
      text-align: center;
      letter-spacing: 2px;
      color: var(--text-dark);
      background: #ffffff;
      transition: all 0.25s ease;
      outline: none;
    }

    .password-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(75, 107, 130, 0.15);
    }

    .password-input.error {
      border-color: #e57373;
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .btn-submit {
      width: 100%;
      padding: 1rem 2rem;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 6px 20px rgba(75, 107, 130, 0.25);
    }

    .btn-submit:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(75, 107, 130, 0.35);
    }

    .error-msg {
      color: #d32f2f;
      font-size: 0.85rem;
      margin-top: 0.8rem;
      display: none;
    }

    .lang-switcher-gate {
      display: inline-flex;
      background: #f0f4f8;
      border-radius: 20px;
      padding: 3px;
      margin-bottom: 1.5rem;
      gap: 2px;
    }

    .lang-btn {
      background: transparent;
      border: none;
      padding: 3px 9px;
      border-radius: 14px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }

    .lang-btn.active {
      background: var(--primary);
      color: #fff;
    }

    @media (max-width: 600px) {
      .login-card {
        padding: 2.5rem 1.6rem;
      }
      h1 {
        font-size: 2.4rem;
      }
      .floral-corner {
        width: 200px;
        height: 200px;
      }
    }
  </style>
</head>

  <div class="floral-corner floral-top-left"></div>
  <div class="floral-corner floral-bottom-right"></div>

  <!-- Scheda di Benvenuto con Richiesta Password -->
  <div class="login-card">
    
    <div class="lang-switcher-gate">

      <button class="lang-btn" id="btnGateDE" onclick="setGateLang('de')">DE</button>

    <div class="cross-symbol">
      <svg width="36" height="36" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 12 V68" stroke="#b89d6e" stroke-width="3" stroke-linecap="round"/>
        <path d="M36 28 H64" stroke="#b89d6e" stroke-width="3" stroke-linecap="round"/>
        <circle cx="43" cy="56" r="16" stroke="#b89d6e" stroke-width="3.5" fill="none"/>
        <circle cx="57" cy="56" r="16" stroke="#cbb287" stroke-width="3.5" fill="none"/>
      </svg>
    </div>

    <div class="badge" id="txtBadge">Il nostro matrimonio</div>
    <h1>Annalisa <span>&</span> Matteo</h1>
    <div class="date" id="txtDate">24 APRILE 2027 &bull; THIENE (VI)</div>

    <p class="instruction" id="txtInstruction">
      Inserisci la password per visualizzare i dettagli della nostra giornata.
    </p>

    <form onsubmit="handleUnlock(event)">
      <div class="input-group">
        <input type="password" id="passInput" class="password-input" placeholder="Password" autofocus required>
        <div class="error-msg" id="errorMsg">Password non corretta. Riprova!</div>
      </div>
      <button type="submit" class="btn-submit" id="btnSubmit">Entra nel sito</button>
    </form>

  <script>
    const gateI18n = {
      it: {
        badge: "Il nostro matrimonio",
        date: "24 APRILE 2027 • THIENE (VI)",
        instruction: "Inserisci la password per visualizzare i dettagli della nostra giornata.",
        placeholder: "Password",
        btn: "Entra nel sito",
        error: "Password non corretta. Riprova!"
      },
      de: {
        badge: "Unsere Hochzeit",
        date: "24. APRIL 2027 • THIENE (VI)",
        instruction: "Bitte gebt das Passwort ein, um die Details zu unserer Hochzeit zu sehen.",
        placeholder: "Passwort",
        btn: "Website betreten",
        error: "Falsches Passwort. Bitte erneut versuchen!"
      }
    };

    let gateLang = 'it';

    function setGateLang(lang) {
      gateLang = lang;
      document.getElementById('btnGateIT').classList.toggle('active', lang === 'it');
      document.getElementById('btnGateDE').classList.toggle('active', lang === 'de');
      document.getElementById('txtBadge').innerText = gateI18n[lang].badge;
      document.getElementById('txtDate').innerText = gateI18n[lang].date;
      document.getElementById('txtInstruction').innerText = gateI18n[lang].instruction;
      document.getElementById('passInput').placeholder = gateI18n[lang].placeholder;
      document.getElementById('btnSubmit').innerText = gateI18n[lang].btn;
      document.getElementById('errorMsg').innerText = gateI18n[lang].error;
    }

    // Funzione di decifratura sicura AES
    function decryptSite(password) {
      try {
        const encryptedData = document.getElementById('encryptedPayload').innerText.trim();
        const decryptedBytes = CryptoJS.AES.decrypt(encryptedData, password);
        const decryptedHtml = decryptedBytes.toString(CryptoJS.enc.Utf8);
        
        // Verifica se la decifratura ha prodotto HTML valido
        if (decryptedHtml && decryptedHtml.includes("<!DOCTYPE html>")) {
          try { localStorage.removeItem('wedding_auth'); } catch(e){}
          
          document.open();
          document.write(decryptedHtml);
          document.close();
          return true;
        }
      } catch (err) {}
      return false;
    }

    function handleUnlock(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('passInput');
      const errorMsg = document.getElementById('errorMsg');
      const enteredPass = input.value.trim();

      const success = decryptSite(enteredPass);
      if (!success) {
        input.classList.add('error');
        errorMsg.style.display = 'block';
        setTimeout(() => input.classList.remove('error'), 400);
      }
    }

    // Accesso rapido via URL
    window.addEventListener('DOMContentLoaded', () => {
      try { localStorage.removeItem('wedding_auth'); } catch(e){}
      const urlParams = new URLSearchParams(window.location.search);
      const urlPass = urlParams.get('pass') || urlParams.get('pwd');
      if (urlPass) {
        decryptSite(urlPass);
      }
    });
  </script>
